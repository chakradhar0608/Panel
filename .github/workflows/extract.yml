name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o panel_v10_client_reports.zip -d extracted
          cp -r extracted/panel_v10/* .
          cp -r extracted/panel_v10/.[!.]* . 2>/dev/null || true
          rm -rf extracted
          rm -f panel_v10_client_reports.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract project files" || echo "Nothing to commit"
          git push
